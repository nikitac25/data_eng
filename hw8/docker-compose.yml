version: "3.9"
services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
  broker:
    image: bitnami/kafka:3.7
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://broker:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics.sh --bootstrap-server broker:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
  # Optional: a simple consumer you can exec into
  ktools:
    image: bitnami/kafka:3.7
    container_name: ktools
    depends_on:
      - broker
    entrypoint: ["bash", "-lc", "sleep infinity"]
    environment:
      - ALLOW_PLAINTEXT_LISTENER=yes
