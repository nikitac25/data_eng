services:
  mongodb:
    image: mongo:8.0
    container_name: assessment_db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./mongodb_archive:/data/db
      - ./scripts/mongosh:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD","mongosh","mongodb://${MONGO_USER}:${MONGO_PASSWORD}@localhost:27017/admin?authSource=admin","--eval","db.runCommand({ connectionStatus: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 20

  python:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
        - ./datasources:/datasources:ro
    environment:
      MONGO_URI: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:27017/${MONGO_DB}?authSource=admin"
      MONGO_DB: ${MONGO_DB}
      CSV_DIR: /datasources
      SESSION_GAP_MINUTES: ${SESSION_GAP_MINUTES}
    depends_on:
      mongodb:
          condition: service_healthy
    command: ["python", "insert_data_sessions.py"]


