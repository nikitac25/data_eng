services:
  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      ALLOW_ANONYMOUS_LOGIN: ${ALLOW_ANONYMOUS_LOGIN}
    networks:
      - wiki-net

  kafka:
    image: bitnami/kafka:latest
    environment:
      ALLOW_PLAINTEXT_LISTENER: ${ALLOW_ANONYMOUS_LOGIN}
      KAFKA_CFG_NODE_ID: ${KAFKA_CFG_NODE_ID}
      KAFKA_CFG_PROCESS_ROLES: ${KAFKA_CFG_PROCESS_ROLES}
      KAFKA_CFG_LISTENERS: ${KAFKA_CFG_LISTENERS}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CFG_CONTROLLER_QUORUM_VOTERS}
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: ${KAFKA_CFG_CONTROLLER_LISTENER_NAMES}
      KAFKA_CFG_ZOOKEEPER_CONNECT: ${KAFKA_CFG_ZOOKEEPER_CONNECT}
    depends_on:
      - zookeeper
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 45s
    networks:
      - wiki-net

  bootstrap-kafka:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
    command: [ "python", "kafka_topic_creator.py" ]
    volumes:
      - ./scripts/python:/scripts
    networks:
      - wiki-net

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
      CASSANDRA_DATACENTER: ${CASSANDRA_DATACENTER}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE}
    ports:
      - "9042:9042"
    volumes:
      - ./cassandra_logs:/var/lib/cassandra
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local'" ]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - wiki-net

  bootstrap-cassandra:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE}
      CASSANDRA_HOST: ${CASSANDRA_HOST}
      CASSANDRA_PORT: ${CASSANDRA_PORT}
      CASSANDRA_TABLE: ${CASSANDRA_TABLE}
    command: [ "python", "cassandra_table_creator.py" ]
    volumes:
      - ./scripts/python:/scripts
    networks:
      - wiki-net

  spark-master:
    image: bitnami/spark:3.5.5-debian-12-r6
    environment:
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE}
      CASSANDRA_HOST: ${CASSANDRA_HOST}
      CASSANDRA_PORT: ${CASSANDRA_PORT}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      CASSANDRA_TABLE: ${CASSANDRA_TABLE}
      SPARK_MODE: master
    depends_on:
      bootstrap-cassandra:
        condition: service_completed_successfully
      bootstrap-kafka:
        condition: service_completed_successfully
      producer:
        condition: service_started
    volumes:
      - ./scripts/python:/scripts
    command: >
      bash -c "
      /opt/bitnami/spark/bin/spark-submit
      --master local[*]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.2.0,com.datastax.spark:spark-cassandra-connector_2.12:3.4.1
      /scripts/message_consumer.py
      "
    ports:
      - "8080:8080"
    networks:
      - wiki-net

  spark-worker:
    image: bitnami/spark:3.5.5-debian-12-r6
    environment:
      SPARK_MASTER_URL: ${SPARK_MASTER_URL}
        - SPARK_MODE = worker
    depends_on:
      - spark-master
    networks:
      - wiki-net

  producer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      WIKIPEDIA_ENDPOINT: ${WIKIPEDIA_ENDPOINT}
    command: [ "python", "-u", "message_producer.py" ]
    volumes:
      - ./scripts/python:/scripts
    networks:
      - wiki-net

networks:
  wiki-net:
    name: wiki-net
    driver: bridge

volumes:
  cassandra_logs: