services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile
    image: mysql:8.0
    container_name: mysqldb
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${ADMIN_USER}
      MYSQL_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u${ADMIN_USER} -p${ADMIN_PASSWORD} -D$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      retries: 15
      start_period: 20s
    volumes:
      - ./mysql_logs:/var/lib/mysql
      - ./scripts/ddl:/docker-entrypoint-initdb.d

  data_uploader:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${ADMIN_USER}
      MYSQL_PASSWORD: ${ADMIN_PASSWORD}
      MYSQL_HOST: mysql
    volumes:
      - ./datasources:/data

volumes:
  mysql_logs: